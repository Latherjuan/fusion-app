<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusión de Sabor Natural</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <img src="assets/logo.png" alt="Fusión de Sabor Natural" style="width:44px;height:44px;border-radius:50%">
      <div class="brand-word">Fusión<small>Sabor Natural</small></div>
    </div>
    <h2>Iniciar sesión</h2>
    <div class="login-sub" id="login-sub">Escribe tu correo y te enviamos un enlace para entrar. Sin contraseña.</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field"><label class="field-label">Correo</label><input type="email" id="login-email" autocomplete="email" required autocapitalize="off" placeholder="tu@correo.com"></div>
      <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:6px">Enviarme el enlace</button>
    </form>
    <div id="login-sent" style="display:none;margin-top:14px;font-size:13.5px;color:var(--text-muted)">
      Revisa tu bandeja de entrada (y spam). Abre el enlace desde <b>este mismo dispositivo</b> para entrar.
      <div style="margin-top:10px"><button type="button" class="btn btn-ghost btn-sm" id="login-retry">Usar otro correo</button></div>
    </div>
  </div>
</div>
<div id="shell" style="display:none">
  <aside id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="Fusión de Sabor Natural" style="width:34px;height:34px;border-radius:50%">
      <div class="brand-word">Fusión<small>Sabor Natural</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="session-box">
        <label>Sesión activa</label>
        <div class="session-row">
          <div><div class="sname" id="session-name"></div><div class="srole" id="session-role"></div></div>
          <button class="icon-btn" data-action="logout" title="Cerrar sesión"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
        </div>
      </div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="hamburger" aria-label="Menú"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div>
        <h1 id="page-title">Panel</h1>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
      <div class="spacer"></div>
      <div id="today-pill"></div>
    </div>
    <div id="content"><div class="view-wrap" id="view-wrap"></div></div>
  </div>
</div>

<div id="modal-overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/html2canvas.min.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/stats.js"></script>
<script src="js/admin.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
